<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>스타 닮은꼴 봇</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172026;
        --muted: #65727e;
        --line: #d9e0e7;
        --panel: #ffffff;
        --wash: #f4f7f9;
        --mint: #2f8f83;
        --coral: #df6b57;
        --blue: #3b6ea8;
        --gold: #c28d2d;
        --shadow: 0 18px 55px rgba(23, 32, 38, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(47, 143, 131, 0.12), transparent 36%),
          linear-gradient(315deg, rgba(223, 107, 87, 0.14), transparent 34%),
          var(--wash);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 8px;
        background: var(--ink);
        color: white;
        font-weight: 850;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.45rem, 3vw, 2.15rem);
        letter-spacing: 0;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        white-space: nowrap;
        font-size: 0.88rem;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(290px, 390px) 1fr;
        gap: 20px;
        align-items: start;
      }

      .uploader,
      .results,
      .notice {
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(217, 224, 231, 0.9);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .uploader {
        padding: 18px;
        position: sticky;
        top: 18px;
      }

      .dropzone {
        display: grid;
        min-height: 360px;
        place-items: center;
        border: 1.5px dashed #a9b7c3;
        border-radius: 8px;
        background: #fbfcfd;
        cursor: pointer;
        overflow: hidden;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          background 160ms ease;
      }

      .dropzone:hover,
      .dropzone.is-dragging {
        border-color: var(--mint);
        background: #f1faf8;
        transform: translateY(-1px);
      }

      .dropzone input {
        display: none;
      }

      .empty-state {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px;
        text-align: center;
      }

      .upload-icon {
        display: grid;
        width: 66px;
        height: 66px;
        place-items: center;
        border-radius: 8px;
        background: #eaf4f2;
        color: var(--mint);
      }

      .empty-state strong {
        font-size: 1.05rem;
      }

      .empty-state span {
        color: var(--muted);
        line-height: 1.55;
      }

      .preview {
        display: none;
        width: 100%;
        height: 100%;
        min-height: 360px;
        object-fit: cover;
      }

      .has-image .preview {
        display: block;
      }

      .has-image .empty-state {
        display: none;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        padding: 0 14px;
        cursor: pointer;
        color: white;
        background: var(--ink);
      }

      .btn.secondary {
        color: var(--ink);
        border: 1px solid var(--line);
        background: white;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .notice {
        margin-bottom: 16px;
        padding: 14px 16px;
        color: #45525d;
        line-height: 1.55;
      }

      .results {
        padding: 18px;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        font-size: 1.22rem;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
      }

      .match-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .featured-match {
        display: grid;
        grid-template-columns: minmax(170px, 260px) 1fr;
        gap: 16px;
        margin-bottom: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .featured-match[hidden] {
        display: none;
      }

      .featured-match .portrait {
        height: 100%;
        min-height: 300px;
      }

      .featured-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        justify-content: center;
        padding: 18px;
      }

      .featured-kicker {
        color: var(--coral);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .featured-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .featured-title strong {
        font-size: clamp(1.55rem, 4vw, 2.5rem);
        letter-spacing: 0;
      }

      .feature-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .feature-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfd;
      }

      .feature-item b {
        display: block;
        margin-bottom: 5px;
        font-size: 0.9rem;
      }

      .feature-item span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .portrait {
        aspect-ratio: 4 / 5;
        width: 100%;
        object-fit: cover;
        background: linear-gradient(135deg, #dce8e5, #f3dfd8);
      }

      .fallback-portrait {
        display: grid;
        aspect-ratio: 4 / 5;
        place-items: center;
        padding: 20px;
        text-align: center;
        color: white;
        background:
          linear-gradient(135deg, rgba(23, 32, 38, 0.72), rgba(47, 143, 131, 0.72)),
          linear-gradient(45deg, var(--coral), var(--blue));
        font-size: 1.3rem;
        font-weight: 800;
      }

      .card-body {
        padding: 12px;
      }

      .name-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .name {
        min-width: 0;
        font-weight: 800;
      }

      .score {
        flex: 0 0 auto;
        color: var(--mint);
        font-weight: 850;
      }

      .meter {
        height: 8px;
        margin: 12px 0 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #edf1f3;
      }

      .meter span {
        display: block;
        height: 100%;
        width: var(--score, 0%);
        border-radius: inherit;
        background: linear-gradient(90deg, var(--mint), var(--gold), var(--coral));
      }

      .reason {
        min-height: 42px;
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
      }

      .placeholder {
        display: grid;
        min-height: 470px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
        color: var(--muted);
        text-align: center;
        padding: 28px;
      }

      .placeholder[hidden] {
        display: none;
      }

      .placeholder strong {
        display: block;
        margin-bottom: 8px;
        color: var(--ink);
        font-size: 1.1rem;
      }

      canvas {
        display: none;
      }

      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .uploader {
          position: static;
        }

        .match-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .featured-match {
          grid-template-columns: 1fr;
        }

        .featured-match .portrait {
          min-height: 0;
        }
      }

      @media (max-width: 560px) {
        .app {
          width: min(100% - 22px, 1180px);
          padding-top: 18px;
        }

        .topbar,
        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .badge,
        .status {
          text-align: left;
          white-space: normal;
        }

        .match-grid {
          grid-template-columns: 1fr;
        }

        .feature-list {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">AI</div>
          <div>
            <h1>스타 닮은꼴 봇</h1>
            <p class="subtitle">사진을 올리면 분위기가 가까운 셀럽 카드를 보여줘요.</p>
          </div>
        </div>
        <div class="badge">HTML 업로드 · Python 분석 · CSV 비교</div>
      </header>

      <div class="workspace">
        <section class="uploader" aria-label="사진 업로드">
          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept="image/*" />
            <img class="preview" id="preview" alt="업로드한 사진 미리보기" />
            <span class="empty-state">
              <span class="upload-icon" aria-hidden="true">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                  <path d="M12 16V4m0 0 5 5m-5-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M20 16.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </span>
              <strong>얼굴 사진 업로드</strong>
              <span>클릭하거나 이미지를 끌어다 놓으면 바로 매칭을 시작합니다.</span>
            </span>
          </label>
          <div class="actions">
            <button class="btn" id="analyzeBtn" disabled>다시 매칭</button>
            <button class="btn secondary" id="clearBtn" disabled>초기화</button>
          </div>
        </section>

        <section>
          <div class="notice">
            HTML은 사진 업로드와 결과 표시만 담당하고, Python 서버가 사진 특징값과 얼굴형·눈·코·입 비율을 추정해 CSV의 연예인 수치와 비교합니다.
          </div>
          <div class="results">
            <div class="section-head">
              <h2>매칭 결과</h2>
              <div class="status" id="status">사진을 올리면 결과가 여기에 표시됩니다.</div>
            </div>
            <div class="placeholder" id="placeholder">
              <div>
                <strong>아직 분석할 사진이 없어요.</strong>
                자연광 사진이나 정면 셀카를 올리면 카드가 더 그럴듯하게 정렬됩니다.
              </div>
            </div>
            <div class="featured-match" id="featuredMatch" hidden></div>
            <div class="match-grid" id="matchGrid" hidden></div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const fileInput = document.querySelector("#fileInput");
      const dropzone = document.querySelector("#dropzone");
      const preview = document.querySelector("#preview");
      const analyzeBtn = document.querySelector("#analyzeBtn");
      const clearBtn = document.querySelector("#clearBtn");
      const statusEl = document.querySelector("#status");
      const grid = document.querySelector("#matchGrid");
      const placeholder = document.querySelector("#placeholder");
      const featuredMatch = document.querySelector("#featuredMatch");
      const API_BASE = location.protocol === "file:" ? "http://127.0.0.1:5000" : "";

      let uploadedFile = null;
      let uploadedUrl = "";

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function loadFile(file) {
        if (!file || !file.type.startsWith("image/")) {
          setStatus("이미지 파일만 업로드할 수 있습니다.");
          return;
        }

        if (uploadedUrl) URL.revokeObjectURL(uploadedUrl);
        uploadedFile = file;
        uploadedUrl = URL.createObjectURL(file);
        preview.src = uploadedUrl;
        dropzone.classList.add("has-image");
        analyzeBtn.disabled = false;
        clearBtn.disabled = false;

        analyzeImage();
      }

      async function analyzeImage() {
        if (!uploadedFile) return;
        setStatus("Python 서버가 이미지를 분석하는 중입니다...");
        analyzeBtn.disabled = true;

        const formData = new FormData();
        formData.append("photo", uploadedFile);

        try {
          const response = await fetch(`${API_BASE}/api/analyze`, {
            method: "POST",
            body: formData
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "분석에 실패했습니다.");
          renderMatches(data.matches);
        } catch (error) {
          setStatus(`${error.message} Python 서버를 켠 뒤 다시 시도하세요.`);
        } finally {
          analyzeBtn.disabled = false;
        }
      }

      function renderMatches(matches) {
        placeholder.hidden = true;
        featuredMatch.hidden = false;
        grid.hidden = false;
        const [best, ...others] = matches;
        featuredMatch.innerHTML = renderFeatured(best);
        grid.innerHTML = others
          .map((match) => {
            const imageSrc = `${API_BASE}${match.image}`;
            const fallbackSrc = `${API_BASE}/assets/celebrities/placeholder.svg`;
            const imageMarkup = `<img class="portrait" src="${imageSrc}" alt="${match.name} 이미지" loading="lazy" onerror="this.src='${fallbackSrc}'" />`;
            return `
              <article class="card">
                ${imageMarkup}
                <div class="card-body">
                  <div class="name-row">
                    <div class="name">${match.name}</div>
                    <div class="score">${match.score}%</div>
                  </div>
                  <div class="meter" aria-hidden="true"><span style="--score: ${match.score}%"></span></div>
                  <p class="reason">${match.reason}</p>
                </div>
              </article>
            `;
          })
          .join("");
        setStatus(`가장 가까운 매칭: ${best.name} ${best.score}%`);
      }

      function renderFeatured(match) {
        const imageSrc = `${API_BASE}${match.image}`;
        const fallbackSrc = `${API_BASE}/assets/celebrities/placeholder.svg`;
        const features = match.geometry
          .map((item) => `
            <div class="feature-item">
              <b>${item.label} ${item.similarity}%</b>
              <span>내 사진: ${item.user}</span>
              <span>${match.name}: ${item.celebrity}</span>
            </div>
          `)
          .join("");
        return `
          <img class="portrait" src="${imageSrc}" alt="${match.name} 대표 이미지" onerror="this.src='${fallbackSrc}'" />
          <div class="featured-body">
            <div class="featured-kicker">BEST MATCH</div>
            <div class="featured-title">
              <strong>${match.name}</strong>
              <div class="score">${match.score}%</div>
            </div>
            <div class="meter" aria-hidden="true"><span style="--score: ${match.score}%"></span></div>
            <p class="reason">${match.reason}</p>
            <div class="feature-list">${features}</div>
          </div>
        `;
      }

      function resetApp() {
        if (uploadedUrl) URL.revokeObjectURL(uploadedUrl);
        uploadedUrl = "";
        uploadedFile = null;
        fileInput.value = "";
        preview.removeAttribute("src");
        dropzone.classList.remove("has-image");
        analyzeBtn.disabled = true;
        clearBtn.disabled = true;
        grid.hidden = true;
        grid.innerHTML = "";
        featuredMatch.hidden = true;
        featuredMatch.innerHTML = "";
        placeholder.hidden = false;
        setStatus("사진을 올리면 결과가 여기에 표시됩니다.");
      }

      fileInput.addEventListener("change", (event) => loadFile(event.target.files[0]));
      analyzeBtn.addEventListener("click", analyzeImage);
      clearBtn.addEventListener("click", resetApp);

      ["dragenter", "dragover"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add("is-dragging");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove("is-dragging");
        });
      });

      dropzone.addEventListener("drop", (event) => {
        loadFile(event.dataTransfer.files[0]);
      });
    </script>
  </body>
</html>
